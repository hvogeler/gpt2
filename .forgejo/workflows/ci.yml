name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: docker-python
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff (linting)
        run: uv run ruff check .

      - name: Run ruff (formatting)
        run: uv run ruff format --check .

      - name: Run pyright (strict type checking)
        run: uv run pyright src/gpt2

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/gpt2 --cov-report=term-missing