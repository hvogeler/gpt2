name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: docker-python
    container:
      image: ghcr.io/astral-sh/uv:python3.14-bookworm

    steps:
      - name: Install Node.js (required for JS-based actions)
        run: apt-get update && apt-get install -y --no-install-recommends nodejs

      - uses: actions/checkout@v4

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: /root/.cache/uv
          key: uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run ruff (linting)
        run: uv run ruff check .

      - name: Run ruff (formatting)
        run: uv run ruff format --check .

      - name: Run pyright (strict type checking)
        run: uv run pyright src/gpt2

      - name: Run tests
        run: uv run pytest tests/ -v --cov=src/gpt2 --cov-report=term-missing